services:
  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://outpost:outpost@postgres:5432/outpost
      S3_ENABLED: "false"
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_URL: http://localhost:9000/outpost
      SIMULATION_MODE: "true"
      DISCOURSE_MOCK_URL: http://mocks:8080
      DEVTO_MOCK_URL: http://mocks:8080
      WEBHOOK_PARTNER_URL: http://mocks:8080
      LEMMY_BASE_URL: http://mocks:8080
      GHOST_URL: http://mocks:8080
      PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      - postgres
      - mocks
    volumes:
      - ./data:/app/data
      - ./connectors:/app/connectors

  mocks:
    build: ./mocks
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outpost
      POSTGRES_PASSWORD: outpost
      POSTGRES_DB: outpost
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional: docker compose --profile minio up --build
  # If pull fails on Docker Hub, run: docker login
  # or use a pinned tag below after logging in.
  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Optional real Ghost for extended testing (profile: real-ghost)
  ghost:
    image: ghost:5-alpine
    profiles: ["real-ghost"]
    ports:
      - "2368:2368"
    environment:
      url: http://localhost:2368
      NODE_ENV: development

  # Optional real Lemmy stack is heavy; mocks cover certification in default compose.
  lemmy:
    image: dessalines/lemmy:0.19.6
    profiles: ["real-lemmy"]
    ports:
      - "8536:8536"

volumes:
  pgdata:
  miniodata:

key: webhook_hmac
version: 1.0.0
tier: protocol
auth: none
surfaces:
  - key: partner
    content_types: [text, image, video_link]
    spec: {title_max_chars: 500, body_max_chars: 50000, links_allowed: true}
rate_limits:
  per_connection: {requests: 120, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "400": PLATFORM_CONTENT_REJECTED

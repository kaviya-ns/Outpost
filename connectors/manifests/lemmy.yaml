key: lemmy
version: 1.0.0
tier: native
auth: jwt
surfaces:
  - key: post
    content_types: [text, video_link]
    spec: {title_max_chars: 200, body_max_chars: 10000, links_allowed: true}
rate_limits:
  per_connection: {requests: 30, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "400": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
instance_param: base_url

# Render Blueprint (FREE tier) — https://render.com/docs/blueprint-spec
#
# Database is NOT on Render (paid). Use Neon free Postgres and set DATABASE_URL manually.
# See docs/DEPLOY.md
services:
  - type: web
    name: outpost-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: S3_ENABLED
        value: false
      - key: SIMULATION_MODE
        value: true
      - key: RECERT_SCHEDULER_ENABLED
        value: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 120
      # Create at https://neon.tech — paste connection string in Render dashboard after deploy
      - key: DATABASE_URL
        sync: false
      - key: DEMO_API_KEY
        generateValue: true
      # Set to https://<your-service>.onrender.com after first deploy
      - key: PUBLIC_BASE_URL
        sync: false
